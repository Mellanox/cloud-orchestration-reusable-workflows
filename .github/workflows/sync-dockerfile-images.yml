name: Sync Dockerfile image tags to reusable workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - network-operator-*

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN_NVIDIA_CI_CD }}
          ref: ${{ github.ref_name }}
      - name: Extract image tags from Dockerfile
        id: extract
        run: |
          doca=$(awk '/ AS BASE_IMAGE_DOCA_FULL_RT_HOST/ {print $2; exit}' Dockerfile)
          doca_base=$(awk '/ AS BASE_IMAGE_DOCA_BASE_RT_HOST/ {print $2; exit}' Dockerfile)
          doca_devel=$(awk '/ AS BASE_IMAGE_DOCA_DEVEL_HOST/ {print $2; exit}' Dockerfile)
          go_dev=$(awk '/ AS BASE_IMAGE_GO_DISTROLESS_DEV/ {print $2; exit}' Dockerfile)
          go_base=$(awk '/ AS BASE_IMAGE_GO_DISTROLESS($|\s)/ {print $2; exit}' Dockerfile)
          go_builder=$(awk '/ AS BASE_IMAGE_GO_BUILDER$/ {print $2; exit}' Dockerfile)
          go_builder_alpine=$(awk '/ AS BASE_IMAGE_GO_BUILDER_ALPINE$/ {print $2; exit}' Dockerfile)
          test -n "$go_builder" && test -n "$go_builder_alpine"
          echo "go_builder=$go_builder" >> "$GITHUB_OUTPUT"
          echo "go_builder_alpine=$go_builder_alpine" >> "$GITHUB_OUTPUT"
          echo "doca=$doca" >> $GITHUB_OUTPUT
          echo "doca_base=$doca_base" >> $GITHUB_OUTPUT
          echo "doca_devel=$doca_devel" >> $GITHUB_OUTPUT
          echo "go_dev=$go_dev" >> $GITHUB_OUTPUT
          echo "go_base=$go_base" >> $GITHUB_OUTPUT
      - name: Update fork-ci-reusable.yml envs if needed
        id: update
        env:
          DOCA: ${{ steps.extract.outputs.doca }}
          DOCA_BASE: ${{ steps.extract.outputs.doca_base }}
          DOCA_DEVEL: ${{ steps.extract.outputs.doca_devel }}
          GO_DEV: ${{ steps.extract.outputs.go_dev }}
          GO_BASE: ${{ steps.extract.outputs.go_base }}
          GO_BUILDER: ${{ steps.extract.outputs.go_builder }}
          GO_BUILDER_ALPINE: ${{ steps.extract.outputs.go_builder_alpine }}
        run: |
          file=.github/workflows/fork-ci-reusable.yml
          sed -E -i "s#^([[:space:]]*BASE_IMAGE_DOCA_FULL_RT_HOST:)\s*.*#\\1 ${DOCA}#" "$file"
          sed -E -i "s#^([[:space:]]*BASE_IMAGE_DOCA_BASE_RT_HOST:)\s*.*#\\1 ${DOCA_BASE}#" "$file"
          sed -E -i "s#^([[:space:]]*BASE_IMAGE_DOCA_DEVEL_HOST:)\s*.*#\\1 ${DOCA_DEVEL}#" "$file"
          sed -E -i "s#^([[:space:]]*BASE_IMAGE_GO_DISTROLESS_DEV:)\s*.*#\\1 ${GO_DEV}#" "$file"
          sed -E -i "s#^([[:space:]]*BASE_IMAGE_GO_DISTROLESS:)\s*.*#\\1 ${GO_BASE}#" "$file"
          builder_file=.github/workflows/go-builder-images-reusable.yml
          sed -E -i "s#^([[:space:]]*BASE_IMAGE_GO_BUILDER:)\s*.*#\\1 ${GO_BUILDER}#" "$builder_file"
          sed -E -i "s#^([[:space:]]*BASE_IMAGE_GO_BUILDER_ALPINE:)\s*.*#\\1 ${GO_BUILDER_ALPINE}#" "$builder_file"
          if git diff --quiet --exit-code -- "$file" "$builder_file"; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_NVIDIA_CI_CD }}
        run: |
          git config user.name "nvidia-ci-cd"
          git config user.email "svc-cloud-orch-gh@nvidia.com"
          BRANCH="chore/sync-dockerfile-images-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git add .github/workflows/fork-ci-reusable.yml .github/workflows/go-builder-images-reusable.yml
          git commit -m "chore: sync image tags in reusable workflows from Dockerfile"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --title "chore: sync image tags in reusable workflows" \
            --body $'This PR updates the following envs in `.github/workflows/fork-ci-reusable.yml` based on `Dockerfile`:\n- BASE_IMAGE_DOCA_FULL_RT_HOST\n- BASE_IMAGE_DOCA_BASE_RT_HOST\n- BASE_IMAGE_DOCA_DEVEL_HOST\n- BASE_IMAGE_GO_DISTROLESS_DEV\n- BASE_IMAGE_GO_DISTROLESS\n\nAlso updates BASE_IMAGE_GO_BUILDER and BASE_IMAGE_GO_BUILDER_ALPINE in go-builder-images-reusable.yml.' \
            --base ${{ github.ref_name }} \
            --head "$BRANCH"


