name: Reusable Image Build Check
on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      platforms:
        type: string
        default: linux/amd64
      build-args:
        description: Newline-separated Docker build arguments
        type: string
        default: ''
      runner:
        type: string
        default: ubuntu-latest
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read

jobs:
  go-builder-images:
    uses: ./.github/workflows/go-builder-images-reusable.yml

  build:
    needs: go-builder-images
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            ${{ inputs.build-args }}
            BASE_IMAGE_GO_BUILDER=${{ needs.go-builder-images.outputs.standard }}
            BASE_IMAGE_GO_BUILDER_ALPINE=${{ needs.go-builder-images.outputs.alpine }}
          push: false
